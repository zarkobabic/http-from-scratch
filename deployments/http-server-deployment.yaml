apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: http-from-scratch
  labels:
    app: http-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
        - name: http-server
          image: http-server:v1.0
          ports:
            - name: http
              containerPort: 8080